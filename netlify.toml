[build]
  command = "npm run build:client"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Netlify sets NODE_ENV=production for builds by default, which makes
  # `npm ci` skip devDependencies (vite, @netlify/vite-plugin, tailwindcss,
  # etc.) — but vite.config.ts needs those at build time. Force npm to
  # install them anyway.
  NPM_FLAGS = "--include=dev"

[dev]
  # Without this, `netlify dev` has no dev-server command to run and falls
  # back to [build].command (a one-shot production build) — that never
  # opens a port, so it times out waiting for 5173. Run Vite's actual dev
  # server instead; @netlify/vite-plugin emulates Functions/Blobs inside it.
  # --host 127.0.0.1 forces an IPv4 bind: on this Windows setup Vite's
  # default `localhost` bind resolves to IPv6 (::1), which Netlify CLI's
  # port-open check doesn't see, so it times out even though Vite is
  # genuinely listening and reachable in a browser.
  command = "npx vite --host 127.0.0.1"
  targetPort = 5173
