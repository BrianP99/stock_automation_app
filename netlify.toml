[build]
  command = "npm run build:client"
  publish = "dist"
  functions = "netlify/functions"
  # Docs-only changes (e.g. docs/troubleshooting-log.md) shouldn't burn a
  # production-deploy credit — skip the build when nothing outside docs/ changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!*.md'"

[build.environment]
  NODE_VERSION = "22"
  # Netlify sets NODE_ENV=production for builds by default, which makes
  # `npm ci` skip devDependencies (vite, @netlify/vite-plugin, tailwindcss,
  # etc.) — but vite.config.ts needs those at build time. Force npm to
  # install them anyway.
  NPM_FLAGS = "--include=dev"
